<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e3b" />
      <stop offset="100%" stop-color="#b8141f" />
    </linearGradient>
  </defs>
  <!-- Background Circle (charcoal/dark) -->
  <circle cx="50" cy="50" r="48" fill="#121212" />
  
  <!-- Outer Shaft Ring -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#redGrad)" stroke-width="4" stroke-dasharray="10 6" />
  
  <!-- Drive Shaft Center Joint representation -->
  <rect x="44" y="25" width="12" height="50" rx="3" fill="#ffffff" />
  <circle cx="50" cy="50" r="12" fill="url(#redGrad)" />
  <circle cx="50" cy="50" r="5" fill="#ffffff" />
  <rect x="35" y="47" width="30" height="6" rx="2" fill="#ffffff" />
  
  <!-- Sleek metallic bolt dots -->
  <circle cx="50" cy="30" r="2" fill="#121212" />
  <circle cx="50" cy="70" r="2" fill="#121212" />
</svg>