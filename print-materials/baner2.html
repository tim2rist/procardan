<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baner 2 — ProCardan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      box-sizing: border-box;
    }

    body {
      background-color: #0f172a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    .banner-container {
      width: 100%;
      max-width: 1360px;
      aspect-ratio: 2.5 / 1;
      background: #ffffff;
      position: relative;
      overflow: hidden;
      break-inside: avoid;
      page-break-inside: avoid;
      container-type: inline-size;
      padding: 3cqw 4cqw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media print {
      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-wrapper {
        padding: 0 !important;
        margin: 0 !important;
        width: 100vw !important;
        min-height: 100vh !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      .banner-container {
        width: 100% !important;
        max-width: 100vw !important;
        height: auto !important;
        box-shadow: none !important;
        border: none !important;
        margin: 0 !important;
      }
      @page {
        size: auto;
        margin: 0mm;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8">

  <!-- ── Print Trigger Button (Screen Only) ── -->
  <div class="no-print mb-8 sticky top-4 z-50">
    <button onclick="window.print()" class="flex items-center gap-2 bg-red-500 hover:bg-red-600 text-white text-sm font-semibold px-6 py-2.5 rounded shadow-lg transition cursor-pointer">
      <span>🖨️ Drukuj PDF</span>
    </button>
  </div>

  <!-- ── Print Wrapper ── -->
  <div class="print-wrapper w-full max-w-7xl px-4 flex justify-center items-center">

    <!-- ════════════════ BANNER 2 (2.5:1 Phone Focus) ════════════════ -->
    <div class="banner-container shadow-2xl rounded-sm border border-slate-200">
      
      <!-- Top Row: Real Logo & Heading -->
      <div class="flex items-center justify-between">
        <div class="flex items-center" style="gap: 1.2cqw;">
          <img src="../public/logo_mark.png" alt="ProCardan Logo" style="height: 3.5cqw; width: auto;" />
          <span style="font-size: 2.8cqw;" class="font-black text-slate-900 tracking-tight leading-none">
            Pro<span class="text-red-500">Cardan</span>
          </span>
        </div>
        <span style="font-size: 1cqw;" class="font-bold text-slate-400 uppercase tracking-widest">
          Serwis Wałów Napędowych
        </span>
      </div>

      <!-- Center: Massive Corporate Heading -->
      <div class="my-auto" style="padding: 0.5cqw 0;">
        <h1 style="font-size: 3.6cqw; line-height: 1.05;" class="font-black text-slate-900 uppercase tracking-tight">
          REGENERACJA WAŁÓW NAPĘDOWYCH
        </h1>
      </div>

      <!-- Direct Contact Hero: Massive Phone Number (Clean, High-Contrast) -->
      <div class="my-auto" style="padding: 0.5cqw 0;">
        <span style="font-size: 1.1cqw;" class="font-extrabold text-red-500 block uppercase tracking-wider mb-[0.2cqw]">
          TEL:
        </span>
        <p style="font-size: 4.8cqw;" class="font-black text-slate-900 tracking-tight whitespace-nowrap leading-none">
          +48 500 05 23 23
        </p>
      </div>

      <!-- Bottom Row: Address & Web -->
      <div class="border-t border-slate-200 flex items-center justify-between" style="padding-top: 1.5cqw;">
        <p style="font-size: 1.2cqw;" class="font-medium text-slate-600">
          ul. Wodzisławska 1, 52-017 Wrocław
        </p>
        <p style="font-size: 1.2cqw;" class="font-semibold text-slate-900 tracking-wide">
          WWW.PROCARDAN.PL
        </p>
      </div>

    </div>

  </div>

</body>
</html>
