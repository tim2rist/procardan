<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baner 2 — ProCardan (Kontaktowy)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1e293b;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .banner-container {
      width: 100%;
      max-width: 1360px;
      aspect-ratio: 3 / 1;
      background: #0f172a;
      position: relative;
      overflow: hidden;
      break-inside: avoid;
      page-break-inside: avoid;
      container-type: inline-size;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 2px;
    }

    /* Driveshaft background overlay */
    .banner-bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.04;
      pointer-events: none;
    }

    .banner-content {
      position: relative;
      z-index: 2;
      padding: 2.2cqw 3.5cqw;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Row */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 1.2cqw;
    }

    .banner-logo {
      height: 2.6cqw;
      width: auto;
    }

    .banner-brand {
      font-size: 2.1cqw;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.3px;
      line-height: 1;
    }

    .banner-brand-accent {
      color: #ef4444;
    }

    .top-tagline {
      font-size: 0.85cqw;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Center: Headline + Phone */
    .center-block {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3cqw;
    }

    .headline {
      font-size: 2.9cqw;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      line-height: 1.05;
    }

    .phone-block {
      text-align: right;
      flex-shrink: 0;
    }

    .phone-label {
      font-size: 0.9cqw;
      font-weight: 700;
      color: #ef4444;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.3cqw;
    }

    .phone-number {
      font-size: 2.8cqw;
      font-weight: 900;
      color: #ffffff;
      white-space: nowrap;
      line-height: 1;
    }

    /* Bottom Row */
    .bottom-row {
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      padding-top: 1.2cqw;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .address-label {
      font-size: 0.7cqw;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.2cqw;
    }

    .address-text {
      font-size: 1.15cqw;
      font-weight: 700;
      color: #e2e8f0;
    }

    .bottom-contact {
      text-align: right;
    }

    .bottom-email-label {
      font-size: 0.7cqw;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.2cqw;
    }

    .bottom-email {
      font-size: 1.15cqw;
      font-weight: 700;
      color: #e2e8f0;
    }

    /* Red accent line */
    .accent-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0.4cqw;
      background: linear-gradient(90deg, #ef4444, #dc2626, #ef4444);
      z-index: 3;
    }

    /* Print button */
    .no-print {
      margin-bottom: 30px;
    }

    .print-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ef4444;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
      transition: background 0.2s;
    }

    .print-btn:hover {
      background: #dc2626;
    }

    .print-wrapper {
      width: 100%;
      max-width: 1360px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @media print {
      body {
        background: #ffffff !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-wrapper {
        padding: 0 !important;
        margin: 0 !important;
        width: 100vw !important;
        min-height: 100vh !important;
        max-width: 100vw !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      .banner-container {
        width: 100% !important;
        max-width: 100vw !important;
        height: auto !important;
        box-shadow: none !important;
        border: none !important;
        margin: 0 !important;
      }
      @page {
        size: auto;
        margin: 0mm;
      }
    }
  </style>
</head>
<body>

  <!-- Print Trigger Button -->
  <div class="no-print">
    <button onclick="window.print()" class="print-btn">
      <span>🖨️ Drukuj PDF</span>
    </button>
  </div>

  <!-- Print Wrapper -->
  <div class="print-wrapper">

    <!-- ════════════════ BANNER 2 (3:1 Landscape Contact) ════════════════ -->
    <div class="banner-container" style="box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);">

      <!-- Driveshaft SVG Background -->
      <svg class="banner-bg-overlay" viewBox="0 0 1400 467" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Main shaft running horizontally -->
        <rect x="50" y="200" width="1300" height="65" rx="6" fill="#94a3b8"/>
        <!-- Flanges -->
        <rect x="20" y="175" width="40" height="115" rx="5" fill="#94a3b8"/>
        <rect x="1340" y="175" width="40" height="115" rx="5" fill="#94a3b8"/>
        <!-- Universal joint left -->
        <circle cx="350" cy="233" r="40" stroke="#94a3b8" stroke-width="6" fill="none"/>
        <line x1="350" y1="185" x2="350" y2="280" stroke="#94a3b8" stroke-width="8"/>
        <line x1="300" y1="233" x2="400" y2="233" stroke="#94a3b8" stroke-width="8"/>
        <!-- Universal joint right -->
        <circle cx="1050" cy="233" r="40" stroke="#94a3b8" stroke-width="6" fill="none"/>
        <line x1="1050" y1="185" x2="1050" y2="280" stroke="#94a3b8" stroke-width="8"/>
        <line x1="1000" y1="233" x2="1100" y2="233" stroke="#94a3b8" stroke-width="8"/>
        <!-- Center support -->
        <circle cx="700" cy="233" r="35" stroke="#94a3b8" stroke-width="5" fill="none"/>
        <circle cx="700" cy="233" r="14" fill="#94a3b8"/>
        <!-- Support triangle -->
        <path d="M700 268 L670 330 L730 330 Z" fill="#94a3b8"/>
      </svg>

      <!-- Red accent bar at the bottom -->
      <div class="accent-bar"></div>

      <div class="banner-content">

        <!-- Top Row: Logo + Tagline -->
        <div class="top-row">
          <div class="top-left">
            <img src="../public/logo_mark.png" alt="ProCardan Logo" class="banner-logo" />
            <span class="banner-brand">
              Pro<span class="banner-brand-accent">Cardan</span>
            </span>
          </div>
          <span class="top-tagline">Serwis Wałów Napędowych</span>
        </div>

        <!-- Center: Headline + Large Phone -->
        <div class="center-block">
          <h1 class="headline">REGENERACJA<br>WAŁÓW NAPĘDOWYCH</h1>
          <div class="phone-block">
            <p class="phone-label">Zadzwoń teraz:</p>
            <p class="phone-number">TEL: +48 500 05 23 23</p>
          </div>
        </div>

        <!-- Bottom Row: Address + Email -->
        <div class="bottom-row">
          <div>
            <p class="address-label">Lokalizacja:</p>
            <p class="address-text">ul. Wodzisławska 1, 52-017 Wrocław</p>
          </div>
          <div class="bottom-contact">
            <p class="bottom-email-label">E-mail:</p>
            <p class="bottom-email">procardan1@gmail.com</p>
          </div>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
